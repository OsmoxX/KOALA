# Cały system KOALA: `docker compose up --build`
#   frontend  http://localhost:3001
#   backend   http://localhost:3000/api
#   baza      localhost:5433 (PostgreSQL 16)
# Zmienne można nadpisać w pliku .env w katalogu głównym (wzór: .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: koala
      POSTGRES_PASSWORD: koala
      POSTGRES_DB: koala
    # 5433 na hoście, żeby nie kolidować z lokalnie zainstalowanym PostgreSQL
    ports:
      - '5433:5432'
    volumes:
      - koala-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U koala -d koala']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://koala:koala@db:5432/koala?schema=public
      JWT_SECRET: ${JWT_SECRET:-zmien-mnie-na-dlugi-losowy-sekret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Konkurs KOALA <onboarding@resend.dev>}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost:3001/weryfikacja-email}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3001/reset-hasla}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:3000/api
    ports:
      - '3001:3001'

volumes:
  koala-db:
