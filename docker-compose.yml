# Lokalna baza danych do pracy deweloperskiej: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: koala
      POSTGRES_PASSWORD: koala
      POSTGRES_DB: koala
    # 5433 na hoście, żeby nie kolidować z lokalnie zainstalowanym PostgreSQL
    ports:
      - '5433:5432'
    volumes:
      - koala-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U koala -d koala']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  koala-db:
